---
apiVersion: v1
kind: ConfigMap
metadata:
  name: basic-auth-sso-proxy-config
data:
  basic-auth-sso-proxy.port.nonsecure: '9090'
  basic-auth-sso-proxy.port.secure: '9443'
  basic-auth-sso-proxy.keystore.mount-path: /mnt
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-sso-proxy-secret
stringData:
  basic-auth-sso-proxy.keystore.passphrase: P@ssw0rd
  quarkus.oidc-client.auth-server-url: https://sso.apps.ocp4.jnyilimb.eu/realms/demo
  quarkus.oidc-client.client-id: basic-auth-sso-proxy
  quarkus.oidc-client.credentials.secret: CHANGEME_SECRET
  quarkus.otel.exporter.otlp.endpoint: http://otel-collector.observability.svc:4317
type: Opaque
---
# Generate a ServiceMonitor resource for the basic-auth-sso-proxy service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: basic-auth-sso-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: basic-auth-sso-proxy
      app.kubernetes.io/version: 1.0.0
  endpoints:
    - scheme: http
      targetPort: 9876
      path: /observe/metrics
      interval: 10s
      honorLabels: true